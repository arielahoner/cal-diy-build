# build-image.yml — construye ghcr.io/<owner>/cal-diy:<sha> desde calcom/cal.diy
# =================================================================================================
# Copia canónica. En el repositorio público va en:  .github/workflows/build-image.yml
#
# Por qué existe (D-002): cal.diy no publica imágenes (Docker Hub sin tags, GHCR inexistente y el
# workflow de release de upstream está roto). La VPS no puede construir (2 vCPU compartidas con
# cargas productivas) y el Mac es ARM. Un runner de repositorio PÚBLICO da 4 vCPU / 16 GB, que es
# lo que necesita el build (MAX_OLD_SPACE_SIZE=6144).
#
# La receta replica .github/actions/docker-build-and-test/action.yml de upstream, que es la única
# combinación probada: Postgres efímero + buildx unido a su namespace de red + build-args + smoke
# test contra /auth/login.
#
# Diferencias deliberadas respecto a upstream (D-017):
#   - Solo linux/amd64 (la VPS es x86_64); sin variante arm64.
#   - Solo GHCR; sin Docker Hub (no hay cuenta ni necesidad).
#   - NEXT_PUBLIC_WEBAPP_URL = URL final horneada, no http://localhost:3000 (D-004).
#   - NEXT_PUBLIC_API_V2_URL sin definir: no desplegamos API v2 y, si se define, Next reescribe
#     /api/v2/* hacia un puerto local muerto.
#   - CALCOM_TELEMETRY_DISABLED=1.
#   - Verificaciones extra: migraciones aplicadas, URL horneada correcta y ausencia de credenciales
#     de build dentro de la imagen.
#
# NUNCA pasar secretos reales como build-args: quedarían en la imagen y en los logs del run.
# Los valores de Postgres de abajo son los de upstream para una base que vive y muere en el runner.
# =================================================================================================

name: Construir imagen de Cal.diy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "SHA completo, corto, rama o tag de calcom/cal.diy (se resuelve a SHA completo)"
        required: true
        # SHA completo a propósito: actions/checkout solo acepta como commit los 40 caracteres; con un
        # SHA corto busca una rama/tag con ese nombre y aborta. Aun así, el paso "Resolver ref" admite
        # también SHAs cortos, ramas y tags.
        default: "176037d0afbe572f870a3c702985e7cd83fe6c0c"
      webapp_url:
        description: "NEXT_PUBLIC_WEBAPP_URL horneada; debe ser idéntica a la del .env de producción"
        required: true
        default: "https://cal.arielsaez.me"
      push:
        description: "Publicar la imagen en GHCR"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  UPSTREAM_REPO: calcom/cal.diy
  IMAGE_NAME: cal-diy
  # Postgres efímero del runner (valores de upstream). No son secretos: la base no sobrevive al job.
  POSTGRES_USER: unicorn_user
  POSTGRES_PASSWORD: magical_password
  POSTGRES_DB: calendso
  DATABASE_HOST: database:5432

jobs:
  build:
    name: Build linux/amd64 + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # -------------------------------------------------------------------------------------
      - name: Validar entradas
        env:
          REF: ${{ inputs.ref }}
          WEBAPP_URL: ${{ inputs.webapp_url }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$'; then
            echo "::error::ref inválida: '$REF'"
            exit 1
          fi
          if ! printf '%s' "$WEBAPP_URL" | grep -Eq '^https://[A-Za-z0-9.-]+$'; then
            echo "::error::webapp_url debe ser https:// sin barra final ni ruta: '$WEBAPP_URL'"
            exit 1
          fi
          echo "ref=$REF  webapp_url=$WEBAPP_URL"

      # -------------------------------------------------------------------------------------
      # actions/checkout solo reconoce como commit un SHA de 40 caracteres; con "176037d0" buscaría una
      # rama o tag con ese nombre y fallaría. Se resuelve antes contra la API (admite SHA corto, rama o tag).
      - name: Resolver ref a SHA completo
        id: resolve
        env:
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${UPSTREAM_REPO}/commits/${REF}" --jq '.sha')"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::no se pudo resolver '$REF' a un SHA de calcom/cal.diy"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "'$REF' → $sha"

      # -------------------------------------------------------------------------------------
      - name: Liberar disco del runner
        run: |
          set -euo pipefail
          echo "Antes:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          echo "Después:"; df -h / | tail -1

      # -------------------------------------------------------------------------------------
      - name: Checkout de cal.diy (upstream, solo lectura)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.resolve.outputs.sha }}
          path: upstream
          persist-credentials: false

      - name: Checkout de este repositorio (parches)
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      # -------------------------------------------------------------------------------------
      - name: Resolver SHA real y etiquetas
        id: meta
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha_full="$(git -C upstream rev-parse HEAD)"
          sha_short="$(git -C upstream rev-parse --short=8 HEAD)"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${IMAGE_NAME}"

          # La etiqueta es el SHA corto real, no la entrada (que puede ser una rama).
          tag="$sha_short"

          {
            echo "sha_full=$sha_full"
            echo "sha_short=$sha_short"
            echo "image=$image"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Construyendo $image:$tag desde $UPSTREAM_REPO@$sha_full"

      # -------------------------------------------------------------------------------------
      - name: Aplicar parches (si los hay)
        id: patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(control/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "Sin parches."
            echo "applied=0" >> "$GITHUB_OUTPUT"
            echo "list=ninguno" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names=""
          for p in "${patches[@]}"; do
            echo "::group::$p"
            cat "$p"
            echo "::endgroup::"
            git -C upstream apply --check "../$p"
            git -C upstream apply --stat --apply "../$p"
            names="${names:+$names,}$(basename "$p")"
          done
          echo "applied=${#patches[@]}" >> "$GITHUB_OUTPUT"
          echo "list=$names" >> "$GITHUB_OUTPUT"
          echo "::warning::Imagen con ${#patches[@]} parche(s): $names. Se etiquetará con sufijo -patched."

      - name: Etiqueta final
        id: tag
        env:
          BASE_TAG: ${{ steps.meta.outputs.tag }}
          APPLIED: ${{ steps.patches.outputs.applied }}
        run: |
          set -euo pipefail
          if [ "$APPLIED" -gt 0 ]; then
            echo "value=${BASE_TAG}-patched" >> "$GITHUB_OUTPUT"
          else
            echo "value=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------------------------------------------------------------------
      # El build de Next necesita una base viva (igual que en upstream): se levanta el Postgres del
      # docker-compose.yml de cal.diy y buildx se une a SU namespace de red, de modo que dentro del
      # build el host "database" resuelve.
      - name: Preparar .env y levantar Postgres efímero
        working-directory: upstream
        run: |
          set -euo pipefail
          grep -o '^[^#]*' .env.example > .env
          # El docker-compose.yml de upstream usa `image: postgres` (= latest). Se fija a la MISMA rama
          # mayor que producción (16) para que las migraciones se prueben contra el motor real.
          cat > compose.override.yml <<'YAML'
          services:
            database:
              image: postgres:16
          YAML
          docker compose -f docker-compose.yml -f compose.override.yml up -d database
          for i in $(seq 1 60); do
            if docker compose exec -T database pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              echo "Postgres listo tras ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres no llegó a estar listo"
          docker compose logs database
          exit 1

      - name: Configurar Buildx unido a la red de la base
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=container:database
          # Igual que upstream. El Dockerfile del SHA fijado no usa RUN --security=insecure ni
          # --network=host; revisar este punto en cada actualización (runbooks/update.md).
          buildkitd-flags: |
            --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------------------------
      - name: Build (sin publicar todavía)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.tag.outputs.value }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=${{ inputs.webapp_url }}
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            CALCOM_TELEMETRY_DISABLED=1
            DATABASE_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.DATABASE_HOST }}/${{ env.POSTGRES_DB }}
            DATABASE_DIRECT_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.DATABASE_HOST }}/${{ env.POSTGRES_DB }}

      # -------------------------------------------------------------------------------------
      - name: Verificar la imagen (URL horneada y ausencia de credenciales de build)
        env:
          REF_IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.tag.outputs.value }}
          WEBAPP_URL: ${{ inputs.webapp_url }}
        run: |
          set -euo pipefail
          echo "::group::Config.Env de la imagen"
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$REF_IMAGE"
          echo "::endgroup::"

          built="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$REF_IMAGE" \
                    | sed -n 's/^BUILT_NEXT_PUBLIC_WEBAPP_URL=//p')"
          if [ "$built" != "$WEBAPP_URL" ]; then
            echo "::error::BUILT_NEXT_PUBLIC_WEBAPP_URL='$built' ≠ '$WEBAPP_URL'"
            exit 1
          fi

          # Ninguna variable sensible debe quedar en la configuración de la imagen final.
          if docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$REF_IMAGE" \
              | grep -Eq '^(NEXTAUTH_SECRET|CALENDSO_ENCRYPTION_KEY|DATABASE_URL|DATABASE_DIRECT_URL)='; then
            echo "::error::La imagen final expone variables de build sensibles en Config.Env"
            exit 1
          fi

          # Y las credenciales del Postgres efímero no deben haberse horneado en los artefactos.
          # Se separa la ejecución del análisis: si el `docker run` fallara, un pipe a `grep -q .`
          # daría "sin coincidencias" y la comprobación pasaría sin haberse hecho.
          set +e
          hallazgos="$(docker run --rm --entrypoint sh "$REF_IMAGE" -c \
                        "grep -rlF '$POSTGRES_PASSWORD' /calcom/apps/web/.next /calcom/apps/web/public 2>/dev/null | head -5")"
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then          # 0 = encontró algo, 1 = no encontró nada, >1 = error real
            echo "::error::No se pudo inspeccionar la imagen (rc=$rc): la comprobación no se hizo"
            exit 1
          fi
          if [ -n "$hallazgos" ]; then
            echo "::error::Se encontraron credenciales de build dentro de la imagen:"
            printf '%s\n' "$hallazgos"
            exit 1
          fi
          echo "Verificación OK: URL horneada correcta y sin credenciales de build."

      # -------------------------------------------------------------------------------------
      - name: Smoke test (/auth/login + migraciones)
        env:
          REF_IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          docker run -d --name caldiy-smoke --network stack \
            -p 127.0.0.1:3000:3000 \
            -e DATABASE_HOST="database:5432" \
            -e DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}" \
            -e DATABASE_DIRECT_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}" \
            -e NEXTAUTH_SECRET="smoke-test-only-not-a-real-secret" \
            -e CALENDSO_ENCRYPTION_KEY="smoke-test-only-not-a-secret-32b" \
            "$REF_IMAGE"

          ok=0
          for i in $(seq 1 90); do
            code="$(curl -o /dev/null -s -w '%{http_code}' http://127.0.0.1:3000/auth/login || true)"
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then
              echo "Servidor sano tras $((i*10))s (HTTP $code)"; ok=1; break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx caldiy-smoke; then
              echo "::error::El contenedor se detuvo solo"; break
            fi
            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo "::group::Logs del contenedor"; docker logs --tail 200 caldiy-smoke || true; echo "::endgroup::"
            echo "::error::Smoke test fallido: /auth/login nunca respondió 200/307"
            exit 1
          fi

          # start.sh no aborta si fallan las migraciones: hay que comprobarlo explícitamente.
          docker exec caldiy-smoke npx prisma migrate status \
            --schema /calcom/packages/prisma/schema.prisma | tee /tmp/migrate-status.txt
          if ! grep -qiE 'up to date|no pending migrations' /tmp/migrate-status.txt; then
            echo "::error::Migraciones no aplicadas limpiamente sobre una base vacía"
            exit 1
          fi

          echo "::group::Últimos logs"; docker logs --tail 60 caldiy-smoke || true; echo "::endgroup::"

      # -------------------------------------------------------------------------------------
      # Se publica la MISMA imagen que acaba de pasar el smoke test (`docker push` de la imagen ya
      # cargada), no una reconstrucción: así no cabe que se publique algo distinto de lo probado.
      - name: Publicar en GHCR
        id: push
        if: ${{ inputs.push }}
        env:
          REF_IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          id_local="$(docker image inspect --format '{{.Id}}' "$REF_IMAGE")"
          docker push "$REF_IMAGE"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$REF_IMAGE" | sed 's/.*@//')"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::no se pudo leer el digest publicado"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Publicada $REF_IMAGE@$digest (image id local $id_local)"

      # -------------------------------------------------------------------------------------
      - name: Resumen (líneas para deploy/VERSION.lock)
        if: always()
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.tag.outputs.value }}
          SHA_FULL: ${{ steps.meta.outputs.sha_full }}
          SHA_SHORT: ${{ steps.meta.outputs.sha_short }}
          DIGEST: ${{ steps.push.outputs.digest }}
          WEBAPP_URL: ${{ inputs.webapp_url }}
          PATCH_LIST: ${{ steps.patches.outputs.list }}
          PUSHED: ${{ inputs.push }}
        run: |
          set -euo pipefail
          size_h="desconocido"
          if docker image inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            size_h="$(docker image inspect --format '{{.Size}}' "$IMAGE:$TAG" \
                      | awk '{printf "%.2f GB", $1/1024/1024/1024}')"
          fi
          FECHA_BUILD="$(date -u +%Y-%m-%d)"
          SHA_FECHA="$(git -C upstream show -s --format=%cs HEAD 2>/dev/null || echo desconocida)"
          {
            echo "## Imagen Cal.diy"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Origen | \`$UPSTREAM_REPO@$SHA_FULL\` |"
            echo "| Imagen | \`$IMAGE:$TAG\` |"
            echo "| Digest | \`${DIGEST:-no publicada}\` |"
            echo "| Tamaño | $size_h |"
            echo "| URL horneada | \`$WEBAPP_URL\` |"
            echo "| Parches | $PATCH_LIST |"
            echo "| Publicada | $PUSHED |"
            echo ""
            echo "### Pegar en \`deploy/VERSION.lock\`"
            echo ""
            echo '```dotenv'
            echo "CALDIY_SHA=$SHA_SHORT"
            echo "CALDIY_SHA_FECHA=$SHA_FECHA"
            echo "CALDIY_IMAGE_REF=$IMAGE:$TAG"
            echo "CALDIY_DIGEST=${DIGEST:-<no publicada>}"
            echo "CALDIY_IMAGE_SIZE=$size_h"
            echo "CALDIY_BUILD_RUN=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "CALDIY_BUILD_FECHA=$FECHA_BUILD"
            echo "CALDIY_WEBAPP_URL=$WEBAPP_URL"
            echo "CALDIY_PATCHES=$PATCH_LIST"
            echo '```'
            echo ""
            echo "### Y en el \`.env\` de la VPS"
            echo ""
            echo '```dotenv'
            echo "CALDIY_IMAGE=$IMAGE:$TAG@${DIGEST:-<digest>}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpieza
        if: always()
        run: |
          docker rm -f caldiy-smoke >/dev/null 2>&1 || true
          docker compose -f upstream/docker-compose.yml -f upstream/compose.override.yml down -v >/dev/null 2>&1 \
            || docker compose -f upstream/docker-compose.yml down -v >/dev/null 2>&1 || true
